name: Export Solution To Feature Branch

run-name: Export ${{ inputs.solution_name }} to feature/${{ inputs.target_branch }}

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Solution Name"
        required: true
        type: string

      target_branch:
        description: "Feature Branch Name only, example: EmailEnhance"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: powerplatform-export-${{ inputs.solution_name }}
  cancel-in-progress: false

# ════════════════════════════════════════════════════
# Job 1 — Verify branch & validate deployment config
# ════════════════════════════════════════════════════
jobs:
  verify-and-validate:
    runs-on: ubuntu-latest
    outputs:
      target_branch: feature/${{ inputs.target_branch }}
      solution_name: ${{ inputs.solution_name }}
    steps:
      - name: Verify Target Feature Branch Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TARGET="feature/${{ inputs.target_branch }}"
          if ! git ls-remote --exit-code --heads \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "refs/heads/${TARGET}" > /dev/null 2>&1; then
            echo "::error::Branch '${TARGET}' does not exist. Create it first."
            exit 1
          fi
          echo "✅ Branch '${TARGET}' exists."

      - name: Checkout Target Feature Branch
        uses: actions/checkout@v4
        with:
          ref: feature/${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Deployment Config JSON
        shell: bash
        run: |
          CONFIG="solutions/deployment-config.json"
          if [[ ! -f "$CONFIG" ]]; then
            echo "::error::deployment-config.json not found. Create it at solutions/deployment-config.json"
            exit 1
          fi
          if ! jq empty "$CONFIG" 2>/dev/null; then
            echo "::error::deployment-config.json is not valid JSON."
            exit 1
          fi
          echo "✅ Deployment config is valid."

      - name: Verify Connection References in Config
        shell: bash
        run: |
          CONFIG="solutions/deployment-config.json"
          ERRORS=0

          CONNREFS=$(jq -r '.connectionReferences | keys[]' "$CONFIG" 2>/dev/null || echo "")
          if [[ -z "$CONNREFS" ]]; then
            echo "⚠️  No connection references in config. Skipping."
            exit 0
          fi

          while IFS= read -r connref; do
            CONNECTOR_ID=$(jq -r ".connectionReferences[\"$connref\"].connectorId // empty" "$CONFIG")
            CONNECTION_ID=$(jq -r ".connectionReferences[\"$connref\"].connectionId // empty" "$CONFIG")

            if [[ -z "$CONNECTOR_ID" ]]; then
              echo "::error::❌ '$connref' missing connectorId in deployment-config.json"
              ERRORS=$((ERRORS + 1))
            fi
            if [[ -z "$CONNECTION_ID" ]]; then
              echo "::error::❌ '$connref' missing connectionId in deployment-config.json"
              ERRORS=$((ERRORS + 1))
            fi
            if [[ -n "$CONNECTOR_ID" && -n "$CONNECTION_ID" ]]; then
              echo "  ✅ $connref → OK"
            fi
          done <<< "$CONNREFS"

          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::$ERRORS connection reference error(s). Fix deployment-config.json."
            exit 1
          fi
          echo "✅ All connection references verified."

  # ════════════════════════════════════════════════════
  # Job 2 — Export solution from Dataverse
  # ════════════════════════════════════════════════════
  export-solution:
    needs: verify-and-validate
    runs-on: ubuntu-latest
    env:
      SOLUTION_NAME: ${{ inputs.solution_name }}
    steps:
      - name: Checkout Target Feature Branch
        uses: actions/checkout@v4
        with:
          ref: feature/${{ inputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Authenticate to Dataverse
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 5
          command: |
            $POWERPLATFORMTOOLS_PACPATH auth create \
              --applicationId "${{ vars.POWERPLATFORM_APP_ID }}" \
              --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
              --tenant "${{ vars.POWERPLATFORM_TENANT_ID }}" \
              --environment "${{ vars.DEV_ENV_URL }}"

      - name: Generate Versioned File Name
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          VERSIONED="${SOLUTION_NAME}_${TIMESTAMP}_Run${{ github.run_number }}.zip"
          echo "VERSIONED_FILE_NAME=${VERSIONED}" >> "$GITHUB_ENV"
          echo "TEMP_ZIP_PATH=${RUNNER_TEMP}/${VERSIONED}" >> "$GITHUB_ENV"

      - name: Create Folder Structure
        shell: bash
        run: |
          mkdir -p "solutions/unmanaged/${SOLUTION_NAME}/versions"
          mkdir -p "solutions/unmanaged/${SOLUTION_NAME}/src"

      - name: Export Unmanaged Solution
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 15
          command: |
            $POWERPLATFORMTOOLS_PACPATH solution export \
              --name "${SOLUTION_NAME}" \
              --path "${TEMP_ZIP_PATH}" \
              --managed false
            [[ -f "${TEMP_ZIP_PATH}" ]] || { echo "::error::Export failed."; exit 1; }

      - name: Save Versioned ZIP
        shell: bash
        run: |
          cp "${TEMP_ZIP_PATH}" "solutions/unmanaged/${SOLUTION_NAME}/versions/${VERSIONED_FILE_NAME}"

      - name: Unpack Solution
        shell: bash
        run: |
          rm -rf "solutions/unmanaged/${SOLUTION_NAME}/src"
          mkdir -p "solutions/unmanaged/${SOLUTION_NAME}/src"
          $POWERPLATFORMTOOLS_PACPATH solution unpack \
            --zipfile "${TEMP_ZIP_PATH}" \
            --folder "solutions/unmanaged/${SOLUTION_NAME}/src" \
            --packagetype Unmanaged

      - name: Upload Solution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solution-export
          path: |
            solutions/unmanaged/${{ inputs.solution_name }}/
          retention-days: 7

      - name: Clear Authentication
        if: always()
        shell: bash
        run: $POWERPLATFORMTOOLS_PACPATH auth clear || true

  # ════════════════════════════════════════════════════
  # Job 3 — Validate connection refs in cloud flows
  # ════════════════════════════════════════════════════
  validate-solution:
    needs: export-solution
    runs-on: ubuntu-latest
    env:
      SOLUTION_NAME: ${{ inputs.solution_name }}
    steps:
      - name: Download Solution Artifact
        uses: actions/download-artifact@v4
        with:
          name: solution-export
          path: solutions/unmanaged/${{ inputs.solution_name }}/

      - name: Validate Connection References in Cloud Flows
        shell: bash
        run: |
          SRC_DIR="solutions/unmanaged/${SOLUTION_NAME}/src"
          ERRORS=0

          SOLUTION_CONNREFS=$(find "$SRC_DIR" -path "*/connectionreferences/*" -name "*.json" 2>/dev/null \
            | xargs -I{} jq -r '.connectionreferenceid // .name // empty' {} 2>/dev/null \
            | sort -u || echo "")

          echo "Connection references in solution:"
          echo "$SOLUTION_CONNREFS" | sed 's/^/  • /'

          FLOW_FILES=$(find "$SRC_DIR" -path "*/Workflows/*" -name "*.json" 2>/dev/null || echo "")
          if [[ -n "$FLOW_FILES" ]]; then
            while IFS= read -r flow_file; do
              FLOW_NAME=$(basename "$flow_file" .json)
              FLOW_CONNREFS=$(jq -r '.. | .connectionReferenceName? // empty' "$flow_file" 2>/dev/null | sort -u || echo "")
              if [[ -n "$FLOW_CONNREFS" ]]; then
                while IFS= read -r ref; do
                  if ! echo "$SOLUTION_CONNREFS" | grep -qF "$ref"; then
                    echo "::error::❌ Flow '$FLOW_NAME' uses connection '$ref' NOT in the solution."
                    ERRORS=$((ERRORS + 1))
                  fi
                done <<< "$FLOW_CONNREFS"
              fi
            done <<< "$FLOW_FILES"
          fi

          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::$ERRORS unrelated connection reference(s). Add them to the solution."
            exit 1
          fi
          echo "✅ All connection references in flows are part of the solution."

  # ════════════════════════════════════════════════════
  # Job 4 — Import, publish & activate all components
  # ════════════════════════════════════════════════════
  import-and-activate:
    needs: validate-solution
    runs-on: ubuntu-latest
    env:
      SOLUTION_NAME: ${{ inputs.solution_name }}
    steps:
      - name: Checkout Target Feature Branch
        uses: actions/checkout@v4
        with:
          ref: feature/${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Solution Artifact
        uses: actions/download-artifact@v4
        with:
          name: solution-export
          path: solutions/unmanaged/${{ inputs.solution_name }}/

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Authenticate to Dataverse
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 5
          command: |
            $POWERPLATFORMTOOLS_PACPATH auth create \
              --applicationId "${{ vars.POWERPLATFORM_APP_ID }}" \
              --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
              --tenant "${{ vars.POWERPLATFORM_TENANT_ID }}" \
              --environment "${{ vars.DEV_ENV_URL }}"

      - name: Generate Deployment Settings
        shell: bash
        run: |
          CONFIG="solutions/deployment-config.json"
          SETTINGS="solutions/unmanaged/${SOLUTION_NAME}/deployment-settings.json"

          jq '{
            "EnvironmentVariables": [.environmentVariables | to_entries[] | {"SchemaName": .key, "Value": .value}],
            "ConnectionReferences": [.connectionReferences | to_entries[] | {"LogicalName": .key, "ConnectionId": .value.connectionId, "ConnectorId": .value.connectorId}]
          }' "$CONFIG" > "$SETTINGS"

          echo "✅ Deployment settings generated."

      - name: Find Solution ZIP
        shell: bash
        run: |
          ZIP_PATH=$(find "solutions/unmanaged/${SOLUTION_NAME}/versions" -name "*.zip" | sort | tail -1)
          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::No solution ZIP found."
            exit 1
          fi
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Import Solution
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 30
          command: |
            SETTINGS="solutions/unmanaged/${SOLUTION_NAME}/deployment-settings.json"
            IMPORT_ARGS="--path ${ZIP_PATH} --activate-plugins --force-overwrite --publish-changes"
            if [[ -f "$SETTINGS" ]]; then
              IMPORT_ARGS="$IMPORT_ARGS --settings-file $SETTINGS"
            fi
            $POWERPLATFORMTOOLS_PACPATH solution import $IMPORT_ARGS

      - name: Publish All Customizations
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: |
            $POWERPLATFORMTOOLS_PACPATH solution publish

      - name: Activate Cloud Flows, Workflows & Business Rules
        shell: bash
        run: |
          echo "=========================================="
          echo "  Activating Components Post-Deployment"
          echo "=========================================="

          SRC_DIR="solutions/unmanaged/${SOLUTION_NAME}/src"
          FLOW_FILES=$(find "$SRC_DIR" -path "*/Workflows/*" -name "*.json" 2>/dev/null || echo "")

          if [[ -n "$FLOW_FILES" ]]; then
            while IFS= read -r wf_file; do
              WF_NAME=$(jq -r '.name // empty' "$wf_file" 2>/dev/null)
              CATEGORY=$(jq -r '.category // empty' "$wf_file" 2>/dev/null)
              case "$CATEGORY" in
                5) echo "  ✅ Cloud Flow: $WF_NAME" ;;
                0) echo "  ✅ Workflow: $WF_NAME" ;;
                2) echo "  ✅ Business Rule: $WF_NAME" ;;
              esac
            done <<< "$FLOW_FILES"
          fi

          PLUGINS=$(find "$SRC_DIR" -path "*/SdkMessageProcessingSteps/*" -name "*.json" 2>/dev/null | wc -l || echo 0)
          echo "  ✅ Plugin steps: $PLUGINS"
          echo "=========================================="
          echo "✅ All components activated via --activate-plugins and --publish-changes flags."

      - name: Clear Authentication
        if: always()
        shell: bash
        run: $POWERPLATFORMTOOLS_PACPATH auth clear || true

  # ════════════════════════════════════════════════════
  # Job 5 — Commit & push to feature branch
  # ════════════════════════════════════════════════════
  commit-and-push:
    needs: import-and-activate
    runs-on: ubuntu-latest
    env:
      SOLUTION_NAME: ${{ inputs.solution_name }}
    steps:
      - name: Checkout Target Feature Branch
        uses: actions/checkout@v4
        with:
          ref: feature/${{ inputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Solution Artifact
        uses: actions/download-artifact@v4
        with:
          name: solution-export
          path: solutions/unmanaged/${{ inputs.solution_name }}/

      - name: Commit and Push Changes
        shell: bash
        run: |
          TARGET="feature/${{ inputs.target_branch }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "solutions/unmanaged/${SOLUTION_NAME}"
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
            git commit -m "Export ${SOLUTION_NAME} - ${TIMESTAMP}_Run${{ github.run_number }}"
            git pull --rebase origin "${TARGET}"
            git push origin "HEAD:${TARGET}"
            echo "✅ Changes pushed to ${TARGET}."
          else
            echo "No changes detected."
          fi
